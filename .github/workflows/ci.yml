name: CI workflow

on:
    push:

jobs:
    build-and-push: # job name
        runs-on: ubuntu-latest # Github Runner (free)
        steps:
            - name: Checkout code
              uses: actions/checkout@v4 # clone the code in the github runner

            - name: Setup docker
              uses: docker/setup-buildx-action@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:live

